<!DOCTYPE html>
<html lang="en" class="gx-light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/png" href="/assets/nexora-favicon.png?v=ams-20261009" data-brand-favicon />
<title>NEXORA — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5;}
.shell{width:100%;max-width:420px;}
.brand{display:flex;justify-content:center;margin-bottom:14px;}
.brand img{height:60px;width:auto;max-width:100%;object-fit:contain;display:block;}
.login-head{text-align:center;margin-bottom:22px;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:800;margin-bottom:6px;}
.login-head h2{font-size:26px;letter-spacing:-.03em;font-weight:800;}
.login-head p{font-size:13.5px;margin-top:6px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap > svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;pointer-events:none;}
.input-wrap input{width:100%;}
.toggle-pass{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;border-radius:9px;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;}
.refresh-btn{border:0;cursor:pointer;display:inline-grid;place-items:center;}
.refresh-btn svg{width:15px;height:15px;display:block;}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px;font-size:13px;}
.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;}
.checkbox input{width:auto;}
.row-between a{text-decoration:none;font-weight:700;}
.btn{width:100%;border:0;cursor:pointer;font-weight:800;}
.msg{display:none;margin-top:14px;border-radius:12px;padding:10px 12px;font-size:13.5px;text-align:center;}
.msg.show{display:block;}
.footer{text-align:center;font-size:12px;margin-top:20px;}
.ams-test-pill{position:absolute;top:16px;right:18px;font-size:11px;font-weight:800;text-decoration:none;padding:5px 11px;border-radius:999px;}
.creator-cta{margin-top:16px;padding-top:14px;border-top:1px solid rgba(120,145,185,.22);display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;}
.creator-cta span{font-size:12px;}
.creator-cta a{font-size:12.5px;font-weight:800;text-decoration:none;}
</style>

<link rel="stylesheet" href="/assets/qtech-login-anim.css?v=ams-20261031"/>
<script>try{var _qa=localStorage.getItem('qtech_login_anim');document.documentElement.classList.add((_qa==='on'||(_qa!=='off'&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)))?'qtech-anim-on':'qtech-anim-off');}catch(e){}</script>

<script src="/branding/runtime.js"></script><script src="/assets/qtech-login-anim.js?v=ams-20261031" defer></script><link rel="stylesheet" href="/branding/runtime.css"/><link rel="stylesheet" href="/assets/ams-login.css?v=ams-20261026-login6"/>
<link rel="stylesheet" href="/assets/qtech-login-anim.css?v=ams-20261031"/>
<link rel="stylesheet" href="/assets/nexora-theme.css?v=nx-20261112"/>
<link rel="manifest" href="/manifest.webmanifest" /><meta name="theme-color" content="#0b1e42" /><meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><meta name="apple-mobile-web-app-title" content="SMS" /><link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png" /><script src="/assets/pwa-install.js?v=nx-pwa-20261112" defer></script>
</head>
<body class="gx-light gx-login">
  <main class="shell" aria-label="NEXORA login">
    <a class="ams-test-pill" href="/test-login">Test Panel</a>
    <div class="brand"><img data-brand-logo src="/assets/nexora-logo-trim.png?v=ams-20261023" alt="NEXORA" /></div>
    <div class="login-head">
      <div class="eyebrow"><span data-brand-replace="short">NEXORA Secure Access</span></div>
      <h2><span data-brand-replace="name">Welcome to NEXORA</span></h2>
      <p>Sign in to continue to your panel</p>
    </div>
    <form id="loginForm" autocomplete="off">
      <div class="field"><label for="username">Username</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="username" placeholder="Enter username" autocapitalize="none" spellcheck="false" required /></div></div>
      <div class="field"><label for="password">Password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input class="pass-input" type="password" id="password" placeholder="Enter password" required /><button type="button" class="toggle-pass" id="togglePass">Show</button></div></div>
      <div class="row-between"><label class="checkbox"><input type="checkbox" id="remember"/> Remember me</label><a href="#" onclick="return false;">Forgot password?</a></div>
      <button type="submit" class="btn">Sign In</button>
      <div class="creator-cta">
        <span>Want an Agent panel?</span>
        <a href="/creator-register">Create Creator Account</a>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <div class="footer" data-brand="footer">© 2026 NEXORA • Intelligent messaging infrastructure</div>
  </main>
<script>
  const passInput=document.getElementById('password'),togglePass=document.getElementById('togglePass');togglePass.addEventListener('click',()=>{if(passInput.type==='password'){passInput.type='text';togglePass.textContent='Hide';}else{passInput.type='password';togglePass.textContent='Show';}});
  function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='msg show '+type;}
  document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  if(!u || !p){ showMsg('❌ Please enter your username and password.','error'); return; }
  showMsg('⏳ Verifying...','success');
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    .then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');return data;})
    .then(data=>{
      try{
        sessionStorage.clear();
        sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);
        sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);
        localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);
        localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);
        localStorage.setItem('ms_last_page_'+data.user.role,'dashboard');
        localStorage.removeItem('gx_chat_unlock_token');localStorage.removeItem('gx_agent_sec_unlocked');
      }catch(e){}
      showMsg('✅ Welcome '+(data.user.name||data.user.username)+'! Redirecting...','success');
      setTimeout(()=>{window.location.href='/' + data.user.role.toLowerCase();},550);
    })
    .catch(err=>{ showMsg('❌ '+err.message,'error'); });
});
</script>
</body>
</html>
